<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Balangoda Offline Map</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="./lib/maplibre-gl.css" />
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: sans-serif;
      }
      #map {
        width: 100%;
        height: 100%;
      }

      /* Custom UI Controls Panel */
      .map-tools-panel {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 10;
        background: rgba(255, 255, 255, 0.95);
        padding: 10px;
        border-radius: 6px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .map-tools-panel button,
      .map-tools-panel label {
        font-size: 12px;
        padding: 6px 10px;
        background: #2b5b84;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        text-align: center;
      }
      .map-tools-panel input[type="file"] {
        display: none;
      }

      /* Always Visible Attribution Box */
      .maplibregl-ctrl-attrib {
        background: rgba(255, 255, 255, 0.85) !important;
        padding: 4px 8px !important;
        font-size: 11px !important;
        border-radius: 4px !important;
        display: block !important;
      }
      .maplibregl-ctrl-attrib a {
        color: #1b4f72 !important;
        font-weight: bold;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <!-- Tools Panel for GPX & Waypoints -->
    <div class="map-tools-panel">
      <label for="gpx-input">📂 Load GPX File</label>
      <input type="file" id="gpx-input" accept=".gpx" />
      <button id="btn-add-marker">📍 Add Marker at Center</button>
      <button id="btn-clear-markers" style="background: #a93226">
        🗑️ Clear Saved Markers
      </button>
    </div>

    <script src="./lib/pmtiles.js"></script>
    <script src="./lib/maplibre-gl.js"></script>
    <script>
      const protocol = new pmtiles.Protocol();
      maplibregl.addProtocol("pmtiles", protocol.tile);

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", async () => {
          try {
            await navigator.serviceWorker.register("sw.js");
          } catch (err) {
            console.error("Service Worker registration failed:", err);
          }
        });
      }

      let map;
      let savedMarkers = JSON.parse(
        localStorage.getItem("offline_map_markers") || "[]",
      );

      fetch("./style.json")
        .then((res) => res.json())
        .then((style) => {
          const pmtilesUrl = new URL("balangoda.pmtiles", window.location.href)
            .href;

          if (style.sources && style.sources["versatiles-shortbread"]) {
            style.sources["versatiles-shortbread"] = {
              type: "vector",
              url: "pmtiles://" + pmtilesUrl,
            };
          }

          // Apply USGS Topo Visual Palette Overrides
          if (style.layers) {
            style.layers.forEach((layer) => {
              // Earth/Background palette adjustment
              if (layer.type === "background") {
                layer.paint = layer.paint || {};
                layer.paint["background-color"] = "#f4f1ea"; // USGS Topo cream
              }
              // Water bodies
              if (layer.id.includes("water")) {
                layer.paint = layer.paint || {};
                layer.paint["fill-color"] = "#93c4d1"; // USGS Topo blue
              }
              // Contour lines / land features
              if (layer.id.includes("contour") || layer.id.includes("land")) {
                layer.paint = layer.paint || {};
                layer.paint["line-color"] = "#d2b48c"; // USGS Topo tan
              }
            });
          }

          map = new maplibregl.Map({
            container: "map",
            style: style,
            center: [80.701561, 6.650622],
            zoom: 15,
            pitch: 65,
            bearing: -60,
            maxPitch: 85,
            attributionControl: false,
            hash: true,
          });

          // 1. Zoom, Pitch, Rotation Control
          map.addControl(
            new maplibregl.NavigationControl({ visualizePitch: true }),
            "top-right",
          );

          // 2. High-Accuracy GPS Control
          const geolocate = new maplibregl.GeolocateControl({
            positionOptions: { enableHighAccuracy: true, timeout: 10000 },
            trackUserLocation: true,
            showUserHeading: true,
            showAccuracyCircle: true,
          });
          map.addControl(geolocate, "top-right");

          geolocate.on("error", (e) => {
            alert(
              "GPS Location Error: Please ensure device Location/GPS is turned ON in system settings.",
            );
          });

          // 3. Fullscreen Control
          map.addControl(new maplibregl.FullscreenControl(), "top-right");

          // 4. Scale Line Control
          map.addControl(
            new maplibregl.ScaleControl({ maxWidth: 100, unit: "metric" }),
            "bottom-left",
          );

          // 5. Always Visible Attribution Box
          map.addControl(
            new maplibregl.AttributionControl({
              compact: false,
              customAttributions: [
                '<a href="https://www.openstreetmap.org/copyright" target="_blank">© OpenStreetMap</a>',
                '<a href="https://shortbread-tiles.org/" target="_blank">Shortbread</a>',
                '<a href="https://maplibre.org/" target="_blank">MapLibre</a>',
              ],
            }),
            "bottom-right",
          );

          map.on("load", () => {
            // Render stored user markers on map startup
            renderSavedMarkers();

            // Setup GPX Source Container
            map.addSource("gpx-tracks", {
              type: "geojson",
              data: { type: "FeatureCollection", features: [] },
            });

            // Add GPX Track Line Layer
            map.addLayer({
              id: "gpx-tracks-line",
              type: "line",
              source: "gpx-tracks",
              paint: {
                "line-color": "#e74c3c",
                "line-width": 4,
                "line-opacity": 0.85,
              },
            });
          });
        })
        .catch((err) => console.error("Error loading style.json:", err));

      // --- Marked Locations Handling (Local Storage) ---
      function renderSavedMarkers() {
        savedMarkers.forEach((pos) => {
          new maplibregl.Marker({ color: "#27ae60" })
            .setLngLat([pos.lng, pos.lat])
            .setPopup(
              new maplibregl.Popup().setText(pos.label || "Saved Location"),
            )
            .addTo(map);
        });
      }

      document
        .getElementById("btn-add-marker")
        .addEventListener("click", () => {
          if (!map) return;
          const center = map.getCenter();
          const label = prompt(
            "Enter a label for this location:",
            "Marked Location",
          );

          if (label !== null) {
            const markerData = {
              lng: center.lng,
              lat: center.lat,
              label: label,
            };
            savedMarkers.push(markerData);
            localStorage.setItem(
              "offline_map_markers",
              JSON.stringify(savedMarkers),
            );

            new maplibregl.Marker({ color: "#27ae60" })
              .setLngLat([center.lng, center.lat])
              .setPopup(new maplibregl.Popup().setText(label))
              .addTo(map);
          }
        });

      document
        .getElementById("btn-clear-markers")
        .addEventListener("click", () => {
          if (confirm("Delete all saved location markers?")) {
            localStorage.removeItem("offline_map_markers");
            savedMarkers = [];
            location.reload();
          }
        });

      // --- GPX File Parser & Loader ---
      document
        .getElementById("gpx-input")
        .addEventListener("change", function (e) {
          const file = e.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = function (evt) {
            const gpxText = evt.target.result;
            const geojson = parseGPXToGeoJSON(gpxText);

            if (map && map.getSource("gpx-tracks")) {
              map.getSource("gpx-tracks").setData(geojson);

              // Fit map bounds to loaded GPX track
              if (
                geojson.features.length > 0 &&
                geojson.features[0].geometry.coordinates.length > 0
              ) {
                const coords = geojson.features[0].geometry.coordinates;
                const bounds = coords.reduce(
                  (b, coord) => b.extend(coord),
                  new maplibregl.LngLatBounds(coords[0], coords[0]),
                );
                map.fitBounds(bounds, { padding: 40 });
              }
            }
          };
          reader.readAsText(file);
        });

      // Simple GPX XML to GeoJSON LineString Parser
      function parseGPXToGeoJSON(gpxXmlString) {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(gpxXmlString, "text/xml");
        const trkpts = xmlDoc.getElementsByTagName("trkpt");
        const coordinates = [];

        for (let i = 0; i < trkpts.length; i++) {
          const lat = parseFloat(trkpts[i].getAttribute("lat"));
          const lon = parseFloat(trkpts[i].getAttribute("lon"));
          if (!isNaN(lat) && !isNaN(lon)) {
            coordinates.push([lon, lat]);
          }
        }

        return {
          type: "FeatureCollection",
          features: [
            {
              type: "Feature",
              geometry: {
                type: "LineString",
                coordinates: coordinates,
              },
              properties: {},
            },
          ],
        };
      }
    </script>
  </body>
</html>
