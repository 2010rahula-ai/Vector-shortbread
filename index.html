<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balangoda Offline Vector Map</title>
    <link rel="stylesheet" href="./lib/maplibre-gl.css" />
    <link rel="manifest" href="manifest.json" />
    <script src="./lib/maplibre-gl.js"></script>
    <script src="./lib/pmtiles.js"></script>
    <script src="./lib/versatiles-style.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
        background-color: #bddcf4;
      }
      #status {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 1;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 8px;
        border-radius: 4px;
        font-family: sans-serif;
        font-size: 12px;
      }
      #locateButton {
        position: absolute;
        bottom: 20px;
        right: 20px;
        z-index: 1;
        padding: 10px;
        background: #ffffff00;
        border: 2px solid #171717;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="status">Loading Vector Map...</div>
    <button id="locateButton">Find Me</button>
    <div id="map"></div>
    <script>
      const statusBox = document.getElementById("status");

      // 1. Register PMTiles protocol
      const protocol = new pmtiles.Protocol();
      maplibregl.addProtocol("pmtiles", protocol.tile);

      // 2. Load the external style.json file
      fetch("./style.json")
        .then((response) => response.json())
        .then((style) => {
          // Override the source in the style to use our local pmtiles file
          style.sources.openmaptiles = {
            type: "vector",
            url: "pmtiles://./balangoda.pmtiles",
            tileSize: 512,
          };

          const map = new maplibregl.Map({
            container: "map",
            style: "style.json", // Use the loaded style.json
            center: [80.701561, 6.650622],
            zoom: 15,
            pitch: 65, // Tilts the camera for 3D perspective
            bearing: -60, // Rotates the map angle slightly
            maxPitch: 85,
            hash: true,
          });
          // 1. Zoom buttons + Compass
          const nav = new maplibregl.NavigationControl({
            showCompass: true,
            showZoom: true,
            visualizePitch: true,
          });
          map.addControl(nav, "top-right");

          // 2. User Geolocation (GPS)
          const geolocate = new maplibregl.GeolocateControl({
            positionOptions: { enableHighAccuracy: true },
            trackUserLocation: true,
            showUserHeading: true,
          });
          map.addControl(geolocate, "top-right");

          // 3. Fullscreen Button
          map.addControl(new maplibregl.FullscreenControl(), "top-left");

          // 4. Scale Bar
          const scale = new maplibregl.ScaleControl({
            maxWidth: 80,
            unit: "metric",
          });
          map.addControl(scale, "bottom-left");

          map.on("load", () => {
            statusBox.textContent = "Vector Map Ready";
            setTimeout(() => {
              statusBox.style.display = "none";
            }, 3000);
          });

          document
            .getElementById("locateButton")
            .addEventListener("click", () => {
              navigator.geolocation.getCurrentPosition((position) => {
                map.flyTo({
                  center: [position.coords.longitude, position.coords.latitude],
                  zoom: 16,
                });
                new maplibregl.Marker({ color: "red" })
                  .setLngLat([
                    position.coords.longitude,
                    position.coords.latitude,
                  ])
                  .addTo(map);
              });
            });
        })
        .catch((err) => {
          statusBox.textContent = "Error loading style.json";
          console.error(err);
        });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js");
        });
      }
    </script>
  </body>
</html>
