<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Balangoda Offline Map</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="./lib/maplibre-gl.css" />
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #map {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script src="./lib/pmtiles.js"></script>
    <script src="./lib/maplibre-gl.js"></script>
    <script>
      // Register PMTiles Protocol
      const protocol = new pmtiles.Protocol();
      maplibregl.addProtocol("pmtiles", protocol.tile);

      // Register Service Worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", async () => {
          try {
            await navigator.serviceWorker.register("sw.js");
            console.log("Service Worker registered successfully.");
          } catch (err) {
            console.error("Service Worker registration failed:", err);
          }
        });
      }

      // Load Shortbread vector style JSON locally
      fetch("./style.json")
        .then((res) => res.json())
        .then((style) => {
          const pmtilesUrl = new URL("balangoda.pmtiles", window.location.href)
            .href;

          // Route Shortbread vector source to PMTiles archive
          if (style.sources && style.sources["versatiles-shortbread"]) {
            style.sources["versatiles-shortbread"] = {
              type: "vector",
              url: "pmtiles://" + pmtilesUrl,
            };
          }

          // Initialize MapLibre Map with loaded style object
          const map = new maplibregl.Map({
            container: "map",
            style: style,
            center: [80.701561, 6.650622],
            zoom: 15,
            pitch: 0,
            bearing: 0,
            hash: true,
          });

          map.addControl(new maplibregl.NavigationControl());
        })
        .catch((err) => console.error("Error loading style.json:", err));
    </script>
  </body>
</html>
