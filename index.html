<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Balangoda Offline Map</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="./lib/maplibre-gl.css" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #map {
      width: 100%;
      height: 100%;
    }

    /* Fallback styles in case lib/maplibre-gl.css is missing or blocked */
    .maplibregl-ctrl-top-right {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
    }
    .maplibregl-ctrl-bottom-right {
      position: absolute;
      bottom: 10px;
      right: 10px;
      z-index: 2;
    }
    .maplibregl-ctrl-bottom-left {
      position: absolute;
      bottom: 10px;
      left: 10px;
      z-index: 2;
    }
    .maplibregl-ctrl-group {
      background: #ffffff;
      border-radius: 4px;
      box-shadow: 0 0 0 2px rgba(0,0,0,0.1);
      margin-bottom: 10px;
      overflow: hidden;
    }
    .maplibregl-ctrl-group button {
      width: 30px;
      height: 30px;
      display: block;
      padding: 0;
      outline: none;
      border: none;
      box-sizing: border-box;
      background-color: transparent;
      cursor: pointer;
    }
    .maplibregl-ctrl-attrib {
      background: rgba(255, 255, 255, 0.8);
      padding: 2px 5px;
      font-family: sans-serif;
      font-size: 12px;
      border-radius: 3px;
    }
    .maplibregl-ctrl-attrib a {
      color: #0078A8;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="./lib/pmtiles.js"></script>
  <script src="./lib/maplibre-gl.js"></script>
  <script>
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          await navigator.serviceWorker.register("sw.js");
          console.log("Service Worker registered.");
        } catch (err) {
          console.error("Service Worker failed:", err);
        }
      });
    }

    fetch("./style.json")
      .then((res) => res.json())
      .then((style) => {
        const pmtilesUrl = new URL("balangoda.pmtiles", window.location.href).href;

        if (style.sources && style.sources["versatiles-shortbread"]) {
          style.sources["versatiles-shortbread"] = {
            type: "vector",
            url: "pmtiles://" + pmtilesUrl
          };
        }

        const map = new maplibregl.Map({
          container: "map",
          style: style,
          center: [80.701561, 6.650622],
          zoom: 15,
          pitch: 65,
          bearing: -60,
          maxPitch: 85,
          attributionControl: false,
          hash: true
        });

        // 1. Zoom and Rotation Controls
        map.addControl(new maplibregl.NavigationControl({
          visualizePitch: true
        }), 'top-right');

        // 2. High-Accuracy GPS Geolocation
        const geolocate = new maplibregl.GeolocateControl({
          positionOptions: {
            enableHighAccuracy: true,
            timeout: 6000
          },
          trackUserLocation: true,
          showUserHeading: true,
          showAccuracyCircle: true
        });
        map.addControl(geolocate, 'top-right');

        // 3. Fullscreen Button
        map.addControl(new maplibregl.FullscreenControl(), 'top-right');

        // 4. Scale Line
        map.addControl(new maplibregl.ScaleControl({
          maxWidth: 100,
          unit: 'metric'
        }), 'bottom-left');

        // 5. Attribution & Contributor Links
        map.addControl(new maplibregl.AttributionControl({
          compact: false, // Set to false to force text links visible at all times
          customAttributions: [
            '<a href="https://www.openstreetmap.org/copyright" target="_blank">© OpenStreetMap</a>',
            '<a href="https://shortbread-tiles.org/" target="_blank">Shortbread</a>',
            '<a href="https://maplibre.org/" target="_blank">MapLibre</a>'
          ]
        }), 'bottom-right');

      })
      .catch((err) => console.error("Error loading style.json:", err));
  </script>
</body>
</html>
